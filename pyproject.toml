[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-video-generator"
version = "0.1.0"
description = "Local-first MiniMax H3 video generation control plane"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "GPL-3.0-only"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[project.scripts]
aivideo-api = "ai_video_generator.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_video_generator"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
