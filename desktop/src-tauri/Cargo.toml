[package]
name = "ai-video-generator-desktop"
version = "0.2.0-beta.1"
description = "AI Video Generator desktop shell"
authors = ["AI Video Generator contributors"]
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "ai_video_generator_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
